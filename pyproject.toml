[project]
name = "nima-report-engine"
version = "0.3.0"
description = "Deterministic A4 report compiler for finished human-facing PDFs"
requires-python = ">=3.11"
dependencies = [
  "reportlab>=4.4,<5",
  "pypdf>=5,<7",
  "jsonschema>=4,<5",
  "fonttools>=4,<5",
  "PyMuPDF>=1.26,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reportkit"]

[tool.setuptools.package-data]
reportkit = ["data/*.json"]
